[project]
name = "semgrep-generator"
version = "0.1.0"
description = "Feeds generated messages to the semgrep demo board"
requires-python = ">=3.12.3"
dependencies = [
    "click==8.5.0",
    "requests==2.34.2",
    "yfinance==1.7.0",
    "supabase==2.33.0",
    "pandas (==3.1.0)",
    "trafilatura==2.3.1",
    "pyyaml==6.0.3",
]

[tool.poetry]
packages = [{ include = "semgrep_generator" }]

[tool.poetry.scripts]
generator_messages = "semgrep_generator.cli:messages"
generator_quotes = "semgrep_generator.cli:quotes"
generator_ticker = "semgrep_generator.cli:ticker"
generator_news = "semgrep_generator.cli:news"
generator_extract = "semgrep_generator.cli:extract"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
